<!DOCTYPE html>
<html>
<head>
<title>Music Player UI</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f0f0f;
  font-family: Arial, sans-serif;
  color: white;
}


.container {
  display: flex;
  width: 620px;
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
}


.genres {
  width: 40%;
  background: #151515;
  padding: 20px;
}

.genres h3 {
  margin-bottom: 12px;
  color: #4dd0e1;
}

.genres ul {
  list-style: none;
  padding: 0;
}

.genres li {
  padding: 8px;
  margin-bottom: 6px;
  background: #2a2a2a;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.genres li:hover {
  background: #4dd0e1;
  color: black;
}

.player {
  width: 60%;
  padding: 20px;
}

.album {
  height: 140px;
  background: #3a3a3a;
  border-radius: 10px;
  margin-bottom: 15px;
}

h2 {
  margin: 5px 0;
}

.info p {
  font-size: 14px;
  margin: 6px 0;
  color: #cccccc;
}


.progress {
  height: 6px;
  background: #444;
  border-radius: 10px;
  margin: 10px 0;
}

.progress-bar {
  width: 55%;
  height: 100%;
  background: #4dd0e1;
  border-radius: 10px;
}


.time {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #aaaaaa;
  margin-bottom: 12px;
}


.controls {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.controls button {
  background: none;
  border: none;
  color: white;
  font-size: 22px;
  cursor: pointer;
  transition: transform 0.2s, color 0.2s;
}

.controls button:hover {
  transform: scale(1.2);
  color: #4dd0e1;
}
</style>
</head>

<body>

<div class="container">

  
  <div class="genres">
    <h3>Genres</h3>
    <ul>
      <li>Pop</li>
      <li>Rock</li>
      <li>Hip Hop</li>
      <li>Jazz</li>
      <li>Classical</li>
      <li>Lo-Fi</li>
    </ul>
  </div>

  
  <div class="player">
    <div class="album"></div>

    <h2>Night Changes</h2>

    <div class="info">
      <p><strong>Artist:</strong> One Direction</p>
      <p><strong>Genre:</strong> Pop</p>
      <p><strong>Listeners:</strong> 1.5 Billion+</p>
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

  
    <div class="time">
      <span>1:45</span>
      <span>3:46</span>
    </div>

    <div class="controls">
      <button>⏮</button>
      <button>▶</button>
      <button>⏭</button>
    </div>
  </div>

</div>

</body>
</html>
